# ============================================================
# SpaceLinx MES - Azure DevOps CI/CD Pipeline
# Mono-repo: .NET 10 API + React 18 Frontend
# Flow: main → Dev | release/v* → UAT | v* tag → Prod + Demo
# ============================================================

trigger:
  branches:
    include:
      - main
      - 'release/v*'
  tags:
    include:
      - 'v*'
  paths:
    include:
      - 'src/**'
      - 'database/**'
      - 'azure-pipelines.yml'

pr:
  branches:
    include:
      - main

variables:
  dotnetVersion: '10.0.x'
  nodeVersion: '22.x'
  apiProject: 'src/SpaceLinx.Api/SpaceLinx.Api/SpaceLinx.Api.csproj'
  frontendDir: 'src/spacelinx-mes'
  buildConfiguration: 'Release'

stages:
  # ──────────────────────────────────────────────────────────
  # BUILD API (.NET 10) — runs on every trigger
  # ──────────────────────────────────────────────────────────
  - stage: BuildAPI
    displayName: 'Build API'
    jobs:
      - job: Build
        displayName: 'Build & Publish .NET 10 API'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET $(dotnetVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore packages'
            inputs:
              command: 'restore'
              projects: '$(apiProject)'

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(apiProject)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Publish'
            inputs:
              command: 'publish'
              projects: '$(apiProject)'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api --no-build'
              publishWebProjects: false
              zipAfterPublish: true

          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api
            displayName: 'Upload API artifact'

  # ──────────────────────────────────────────────────────────
  # BUILD FRONTEND (lint + build) — runs on every trigger
  # ──────────────────────────────────────────────────────────
  - stage: BuildFrontend
    displayName: 'Build Frontend'
    dependsOn: []
    jobs:
      - job: LintAndBuild
        displayName: 'Lint & Build React Frontend'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '$(nodeVersion)'

          - task: Cache@2
            displayName: 'Cache npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | $(frontendDir)/package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(frontendDir)/node_modules

          - script: npm ci
            displayName: 'Install dependencies'
            workingDirectory: '$(frontendDir)'

          # TODO: Re-enable once lint warnings are resolved
          # - script: npm run lint
          #   displayName: 'ESLint (zero warnings)'
          #   workingDirectory: '$(frontendDir)'

          - script: npm run build
            displayName: 'Build (production)'
            workingDirectory: '$(frontendDir)'

  # ──────────────────────────────────────────────────────────
  # DEPLOY DEV (auto on main branch)
  # ──────────────────────────────────────────────────────────
  - stage: DeployDev
    displayName: 'Deploy to Dev'
    dependsOn: [BuildAPI, BuildFrontend]
    # Auto-deploys on main. From feature/*, bugfix/*, users/* branches: only when
    # the run is manually queued (Pipelines → Run pipeline → pick branch). Dev is
    # a shared env — coordinate before deploying a branch and revert to main after.
    condition: |
      and(succeeded(),
          or(eq(variables['Build.SourceBranch'], 'refs/heads/main'),
             and(eq(variables['Build.Reason'], 'Manual'),
                 or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'),
                    startsWith(variables['Build.SourceBranch'], 'refs/heads/bugfix/'),
                    startsWith(variables['Build.SourceBranch'], 'refs/heads/users/')))))
    jobs:
      - job: BuildFrontendDev
        displayName: 'Build Frontend (Dev)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '$(nodeVersion)'

          - task: Cache@2
            displayName: 'Cache npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | $(frontendDir)/package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(frontendDir)/node_modules

          - script: npm ci
            displayName: 'Install dependencies'
            workingDirectory: '$(frontendDir)'

          - script: npm run build:dev
            displayName: 'Build frontend (dev mode)'
            workingDirectory: '$(frontendDir)'

          - task: ArchiveFiles@2
            displayName: 'Archive build'
            inputs:
              rootFolderOrFile: '$(frontendDir)/dist'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'

          - publish: $(Build.ArtifactStagingDirectory)/frontend.zip
            artifact: frontend-dev
            displayName: 'Upload frontend artifact'

      # Deploy API to Dev (Linux App Service)
      - deployment: DeployApiDev
        displayName: 'Deploy API'
        dependsOn: []
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: api

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxapidev'
                  inputs:
                    azureSubscription: 'SpaceLinxDev'
                    appType: 'webAppLinux'
                    appName: 'spacelinxapidev'
                    resourceGroupName: 'SpaceLinxDev'
                    package: '$(Pipeline.Workspace)/api/*.zip'
                    runtimeStack: 'DOTNETCORE|10.0'

      # Deploy Frontend to Dev (Windows App Service)
      - deployment: DeployWebDev
        displayName: 'Deploy Frontend'
        dependsOn: BuildFrontendDev
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: frontend-dev

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxmesdev'
                  inputs:
                    azureSubscription: 'SpaceLinxDev'
                    appType: 'webApp'
                    appName: 'spacelinxmesdev'
                    resourceGroupName: 'SpaceLinxDev'
                    package: '$(Pipeline.Workspace)/frontend-dev/frontend.zip'

  # ──────────────────────────────────────────────────────────
  # DEPLOY UAT (auto on release/v* branches)
  # ──────────────────────────────────────────────────────────
  - stage: DeployUAT
    displayName: 'Deploy to UAT'
    dependsOn: [BuildAPI, BuildFrontend]
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/v'))
    jobs:
      - job: BuildFrontendUAT
        displayName: 'Build Frontend (UAT)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '$(nodeVersion)'

          - task: Cache@2
            displayName: 'Cache npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | $(frontendDir)/package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(frontendDir)/node_modules

          - script: npm ci
            displayName: 'Install dependencies'
            workingDirectory: '$(frontendDir)'

          - script: npm run build:uat
            displayName: 'Build frontend (UAT mode)'
            workingDirectory: '$(frontendDir)'

          - task: ArchiveFiles@2
            displayName: 'Archive build'
            inputs:
              rootFolderOrFile: '$(frontendDir)/dist'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'

          - publish: $(Build.ArtifactStagingDirectory)/frontend.zip
            artifact: frontend-uat
            displayName: 'Upload frontend artifact'

      - deployment: DeployApiUAT
        displayName: 'Deploy API'
        dependsOn: []
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-uat'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: api

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxapiuat'
                  inputs:
                    azureSubscription: 'SpaceLinxUAT'
                    appType: 'webAppLinux'
                    appName: 'spacelinxapiuat'
                    resourceGroupName: 'SpaceLinxUat'
                    package: '$(Pipeline.Workspace)/api/*.zip'
                    runtimeStack: 'DOTNETCORE|10.0'

      - deployment: DeployWebUAT
        displayName: 'Deploy Frontend'
        dependsOn: BuildFrontendUAT
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-uat'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: frontend-uat

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxmesuat'
                  inputs:
                    azureSubscription: 'SpaceLinxUAT'
                    appType: 'webApp'
                    appName: 'spacelinxmesuat'
                    resourceGroupName: 'SpaceLinxUat'
                    package: '$(Pipeline.Workspace)/frontend-uat/frontend.zip'

  # ──────────────────────────────────────────────────────────
  # DEPLOY PROD + DEMO (on v* tags, with approval gate)
  # ──────────────────────────────────────────────────────────
  - stage: DeployProd
    displayName: 'Deploy to Production + Demo'
    dependsOn: [BuildAPI, BuildFrontend]
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      # Build frontend for Prod
      - job: BuildFrontendProd
        displayName: 'Build Frontend (Prod)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '$(nodeVersion)'

          - task: Cache@2
            displayName: 'Cache npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | $(frontendDir)/package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(frontendDir)/node_modules

          - script: npm ci
            displayName: 'Install dependencies'
            workingDirectory: '$(frontendDir)'

          - script: npm run build
            displayName: 'Build frontend (production mode)'
            workingDirectory: '$(frontendDir)'

          - task: ArchiveFiles@2
            displayName: 'Archive build'
            inputs:
              rootFolderOrFile: '$(frontendDir)/dist'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'

          - publish: $(Build.ArtifactStagingDirectory)/frontend.zip
            artifact: frontend-prod
            displayName: 'Upload frontend artifact'

      # Build frontend for Demo
      - job: BuildFrontendDemo
        displayName: 'Build Frontend (Demo)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '$(nodeVersion)'

          - task: Cache@2
            displayName: 'Cache npm (demo)'
            inputs:
              key: 'npm | "$(Agent.OS)" | $(frontendDir)/package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(frontendDir)/node_modules

          - script: npm ci
            displayName: 'Install dependencies'
            workingDirectory: '$(frontendDir)'

          - script: npm run build:demo
            displayName: 'Build frontend (demo mode)'
            workingDirectory: '$(frontendDir)'

          - task: ArchiveFiles@2
            displayName: 'Archive build'
            inputs:
              rootFolderOrFile: '$(frontendDir)/dist'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'

          - publish: $(Build.ArtifactStagingDirectory)/frontend.zip
            artifact: frontend-demo
            displayName: 'Upload frontend artifact'

      # Deploy API to Prod
      - deployment: DeployApiProd
        displayName: 'Deploy API (Prod)'
        dependsOn: []
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: api

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxapiprod'
                  inputs:
                    azureSubscription: 'SpaceLinxProd'
                    appType: 'webAppLinux'
                    appName: 'spacelinxapiprod'
                    resourceGroupName: 'SpaceLinxProd'
                    package: '$(Pipeline.Workspace)/api/*.zip'
                    runtimeStack: 'DOTNETCORE|10.0'

                - task: AzureAppServiceManage@0
                  displayName: 'Restart API (Prod)'
                  inputs:
                    azureSubscription: 'SpaceLinxProd'
                    action: 'Restart Azure App Service'
                    webAppName: 'spacelinxapiprod'
                    resourceGroupName: 'SpaceLinxProd'

      # Deploy API to Demo
      - deployment: DeployApiDemo
        displayName: 'Deploy API (Demo)'
        dependsOn: []
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-demo'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: api

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxapidemo'
                  inputs:
                    azureSubscription: 'SpaceLinxProd'
                    appType: 'webAppLinux'
                    appName: 'spacelinxapidemo'
                    resourceGroupName: 'SpaceLinxProd'
                    package: '$(Pipeline.Workspace)/api/*.zip'
                    runtimeStack: 'DOTNETCORE|10.0'

      # Deploy Frontend to Prod
      - deployment: DeployWebProd
        displayName: 'Deploy Frontend (Prod)'
        dependsOn: BuildFrontendProd
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: frontend-prod

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxmesprod'
                  inputs:
                    azureSubscription: 'SpaceLinxProd'
                    appType: 'webApp'
                    appName: 'spacelinxmesprod'
                    resourceGroupName: 'SpaceLinxProd'
                    package: '$(Pipeline.Workspace)/frontend-prod/frontend.zip'

                - task: AzureAppServiceManage@0
                  displayName: 'Restart Frontend (Prod)'
                  inputs:
                    azureSubscription: 'SpaceLinxProd'
                    action: 'Restart Azure App Service'
                    webAppName: 'spacelinxmesprod'
                    resourceGroupName: 'SpaceLinxProd'

      # Deploy Frontend to Demo
      - deployment: DeployWebDemo
        displayName: 'Deploy Frontend (Demo)'
        dependsOn: BuildFrontendDemo
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-demo'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: frontend-demo

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxmesdemo'
                  inputs:
                    azureSubscription: 'SpaceLinxProd'
                    appType: 'webApp'
                    appName: 'spacelinxmesdemo'
                    resourceGroupName: 'SpaceLinxProd'
                    package: '$(Pipeline.Workspace)/frontend-demo/frontend.zip'
