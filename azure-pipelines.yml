# ============================================================
# SpaceLinx MES - Azure DevOps CI/CD Pipeline
# Mono-repo: .NET 10 API + React 18 Frontend
# Flow: main → Dev | release/v* → UAT | v* tag → Prod
# ============================================================

trigger:
  branches:
    include:
      - main
      - 'release/v*'
  tags:
    include:
      - 'v*'
  paths:
    include:
      - 'src/**'
      - 'database/**'
      - 'azure-pipelines.yml'

pr:
  branches:
    include:
      - main

variables:
  dotnetVersion: '10.0.x'
  nodeVersion: '22.x'
  # Vite/Rollup bundling of the frontend (~19k modules) peaks near Node's default
  # ~2GB heap and intermittently OOMs (exit 134) during "rendering chunks" — it has
  # failed a UAT build while the same code built fine in another mode/agent. Raise the
  # heap for all frontend build jobs (exposed to script steps as the NODE_OPTIONS env var).
  NODE_OPTIONS: '--max-old-space-size=4096'
  apiProject: 'src/SpaceLinx.Api/SpaceLinx.Api/SpaceLinx.Api.csproj'
  frontendDir: 'src/spacelinx-mes'
  buildConfiguration: 'Release'
  # Gate for the EF DB-migration jobs. Off by default so merging does not break
  # deployments before the per-environment Key Vault secrets + migration role exist.
  # Set to 'true' (pipeline variable) once each environment's KV is configured.
  applyEfMigrations: 'false'

stages:
  # ──────────────────────────────────────────────────────────
  # BUILD API (.NET 10) — runs on every trigger
  # ──────────────────────────────────────────────────────────
  - stage: BuildAPI
    displayName: 'Build API'
    jobs:
      - job: Build
        displayName: 'Build & Publish .NET 10 API'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET $(dotnetVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore packages'
            inputs:
              command: 'restore'
              projects: '$(apiProject)'

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(apiProject)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Publish'
            inputs:
              command: 'publish'
              projects: '$(apiProject)'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api --no-build'
              publishWebProjects: false
              zipAfterPublish: true

          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api
            displayName: 'Upload API artifact'

          # Build the promotable DB artifact (no DB connection — uses the design-time factory).
          - script: |
              cd src/SpaceLinx.Api
              dotnet tool restore
              dotnet ef migrations script --idempotent \
                --project SpaceLinx.Model --startup-project SpaceLinx.Api \
                -o $(Build.ArtifactStagingDirectory)/dbscript/migrate.sql
              cp -r ../../database/repeatable  $(Build.ArtifactStagingDirectory)/dbscript/repeatable
              cp -r ../../database/procedures  $(Build.ArtifactStagingDirectory)/dbscript/procedures
              mkdir -p $(Build.ArtifactStagingDirectory)/dbscript/seed
              cp -r ../../database/seed/* $(Build.ArtifactStagingDirectory)/dbscript/seed/ 2>/dev/null || true
            displayName: 'Generate idempotent migrate.sql + bundle repeatable/procedures/seed'

          - publish: $(Build.ArtifactStagingDirectory)/dbscript
            artifact: dbscript
            displayName: 'Publish dbscript artifact'

  # ──────────────────────────────────────────────────────────
  # BUILD FRONTEND (lint + build) — runs on every trigger
  # ──────────────────────────────────────────────────────────
  - stage: BuildFrontend
    displayName: 'Build Frontend'
    dependsOn: []
    jobs:
      - job: LintAndBuild
        displayName: 'Lint & Build React Frontend'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '$(nodeVersion)'

          - task: Cache@2
            displayName: 'Cache npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | $(frontendDir)/package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(frontendDir)/node_modules

          - script: npm ci
            displayName: 'Install dependencies'
            workingDirectory: '$(frontendDir)'

          # TODO: Re-enable once lint warnings are resolved
          # - script: npm run lint
          #   displayName: 'ESLint (zero warnings)'
          #   workingDirectory: '$(frontendDir)'

          - script: npm run build
            displayName: 'Build (production)'
            workingDirectory: '$(frontendDir)'

  # ──────────────────────────────────────────────────────────
  # VALIDATE DB MIGRATIONS — EF drift gate + build-from-scratch on an
  # ephemeral PostgreSQL service container. Runs on every trigger
  # (PR, release/v*, and v* tags) so it gates promotion to all envs.
  # No environment credentials are used.
  # ──────────────────────────────────────────────────────────
  - stage: ValidateDb
    displayName: 'Validate DB migrations'
    dependsOn: []
    jobs:
      - job: Drift
        displayName: 'EF drift + build-from-scratch'
        pool: { vmImage: 'ubuntu-latest' }
        services:
          postgres: { image: 'postgres:16', ports: ['5432:5432'], env: { POSTGRES_PASSWORD: postgres } }
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET $(dotnetVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - script: |
              set -euo pipefail
              cd src/SpaceLinx.Api
              dotnet tool restore
              # This is a fresh agent (separate job from BuildAPI), so restore the projects
              # before invoking dotnet ef — otherwise project.assets.json is missing and ef
              # can't load metadata (NETSDK1004). ef then does its own implicit build.
              dotnet restore SpaceLinx.Api.sln
              dotnet ef migrations has-pending-model-changes --project SpaceLinx.Model --startup-project SpaceLinx.Api
            displayName: 'Fail on model/migration drift'

          - script: |
              cd src/SpaceLinx.Api
              psql "host=localhost port=5432 user=postgres password=postgres dbname=postgres" -c "CREATE ROLE spacelinxadmin; CREATE ROLE spacelinxuser; CREATE DATABASE spacelinx_ci;" || true
              dotnet ef database update --project SpaceLinx.Model --startup-project SpaceLinx.Api \
                --connection "Host=localhost;Port=5432;Database=spacelinx_ci;Username=postgres;Password=postgres"
            displayName: 'Build schema from scratch (baseline validity)'

          # Catalog-level schema-fidelity gate: compare the EF-built schema (full
          # catalog incl. views/functions) against the UAT ground truth. This
          # closes the "false MATCH from sampling" class of bug — every column,
          # constraint, index, sequence over the 107 managed tables is diffed.
          # The postgres:16 service is reachable at localhost:5432; dblink is
          # created by the gate using superuser `postgres`.
          - script: |
              set -euo pipefail
              # Runs from the repo root ($(Build.SourcesDirectory)); the EF schema
              # was built into spacelinx_ci by the previous step on the same server.
              # 1. Ensure the postgres client (psql) is on PATH for the gate driver.
              if ! command -v psql >/dev/null 2>&1; then
                sudo apt-get update && sudo apt-get install -y postgresql-client
              fi
              export PGPASSWORD=postgres
              CONN="host=localhost port=5432 user=postgres password=postgres dbname=spacelinx_ci"
              # Roles the procedures/views may GRANT to (created on the service in
              # the build-from-scratch step, but guard here too in case of reorder).
              psql "host=localhost port=5432 user=postgres password=postgres dbname=postgres" \
                -c "CREATE ROLE spacelinxadmin;" -c "CREATE ROLE spacelinxuser;" || true
              # 2. Apply procedures then views (manifest order) so the comparison
              #    is over the FULL schema. ON_ERROR_STOP=0 (lenient) — the gate
              #    asserts fidelity, not that every routine compiled.
              for f in $(awk '/^- [0-9]/{print $2}' database/procedures/00_manifest.md); do
                echo "  proc: $f"
                psql "$CONN" -v ON_ERROR_STOP=0 -f "database/procedures/$f" || true
              done
              for f in $(awk '/^- [0-9]/{print $2}' database/repeatable/views/00_manifest.md); do
                echo "  view: $f"
                psql "$CONN" -v ON_ERROR_STOP=0 -f "database/repeatable/views/$f" || true
              done
              # 3. Run the gate against UAT ground truth. The driver builds
              #    cmp_ground from the dump and diffs spacelinx_ci against it,
              #    printing per-category counts + TOTAL_BLOCKING. It exits non-zero
              #    on scope mismatch / load failure but NOT on TOTAL_BLOCKING>0, so
              #    we assert that explicitly below and hard-fail on any drift.
              OUT=$(bash database/audit/run-catalog-diff.sh database/audit/uat.schema.sql \
                --host localhost --port 5432 --user postgres --password postgres \
                --ef-db spacelinx_ci 2>&1) || { echo "$OUT"; echo "##[error]catalog-diff driver failed (scope mismatch / load error)"; exit 1; }
              echo "$OUT"
              TOTAL=$(echo "$OUT" | awk '/TOTAL_BLOCKING/{f=1;next} f&&/^[[:space:]]*[0-9]+[[:space:]]*$/{gsub(/[[:space:]]/,"");print;exit}')
              if [ -z "$TOTAL" ]; then
                echo "##[error]Could not parse TOTAL_BLOCKING from catalog-diff output"; exit 1
              fi
              if [ "$TOTAL" -ne 0 ]; then
                echo "##[error]Catalog schema drift detected: TOTAL_BLOCKING=$TOTAL (EF baseline no longer matches UAT ground truth)"
                exit 1
              fi
              echo "Catalog diff clean: TOTAL_BLOCKING=0"
            displayName: 'Catalog schema-fidelity gate (EF vs UAT ground truth)'

  # ──────────────────────────────────────────────────────────
  # DEPLOY DEV (auto on main branch)
  # ──────────────────────────────────────────────────────────
  - stage: DeployDev
    displayName: 'Deploy to Dev'
    dependsOn: [BuildAPI, BuildFrontend, ValidateDb]
    # Auto-deploys on main. From feature/*, bugfix/*, users/* branches: only when
    # the run is manually queued (Pipelines → Run pipeline → pick branch). Dev is
    # a shared env — coordinate before deploying a branch and revert to main after.
    condition: |
      and(succeeded(),
          or(eq(variables['Build.SourceBranch'], 'refs/heads/main'),
             and(eq(variables['Build.Reason'], 'Manual'),
                 or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'),
                    startsWith(variables['Build.SourceBranch'], 'refs/heads/bugfix/'),
                    startsWith(variables['Build.SourceBranch'], 'refs/heads/users/')))))
    jobs:
      - job: BuildFrontendDev
        displayName: 'Build Frontend (Dev)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '$(nodeVersion)'

          - task: Cache@2
            displayName: 'Cache npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | $(frontendDir)/package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(frontendDir)/node_modules

          - script: npm ci
            displayName: 'Install dependencies'
            workingDirectory: '$(frontendDir)'

          - script: npm run build:dev
            displayName: 'Build frontend (dev mode)'
            workingDirectory: '$(frontendDir)'

          - task: ArchiveFiles@2
            displayName: 'Archive build'
            inputs:
              rootFolderOrFile: '$(frontendDir)/dist'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'

          - publish: $(Build.ArtifactStagingDirectory)/frontend.zip
            artifact: frontend-dev
            displayName: 'Upload frontend artifact'

      # Deploy API to Dev (Linux App Service)
      # Apply DB migrations (EF idempotent script + psql) before the API deploys
      - template: azure-pipelines.db-migrate.yml
        parameters:
          suffix: Dev
          environment: 'spacelinx-mes-dev'
          azureSubscription: 'SpaceLinxDev'
          keyVaultName: 'spacelinx-dev-kv'

      - deployment: DeployApiDev
        displayName: 'Deploy API'
        dependsOn: DeployDbDev
        condition: in(dependencies.DeployDbDev.result, 'Succeeded', 'Skipped')
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: api

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxapidev'
                  inputs:
                    azureSubscription: 'SpaceLinxDev'
                    appType: 'webAppLinux'
                    appName: 'spacelinxapidev'
                    resourceGroupName: 'SpaceLinxDev'
                    package: '$(Pipeline.Workspace)/api/*.zip'
                    runtimeStack: 'DOTNETCORE|10.0'

      # Deploy Frontend to Dev (Windows App Service)
      - deployment: DeployWebDev
        displayName: 'Deploy Frontend'
        dependsOn: BuildFrontendDev
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: frontend-dev

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxmesdev'
                  inputs:
                    azureSubscription: 'SpaceLinxDev'
                    appType: 'webApp'
                    appName: 'spacelinxmesdev'
                    resourceGroupName: 'SpaceLinxDev'
                    package: '$(Pipeline.Workspace)/frontend-dev/frontend.zip'

  # ──────────────────────────────────────────────────────────
  # DEPLOY UAT (auto on release/v* branches)
  # ──────────────────────────────────────────────────────────
  - stage: DeployUAT
    displayName: 'Deploy to UAT'
    dependsOn: [BuildAPI, BuildFrontend, ValidateDb]
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/v'))
    jobs:
      - job: BuildFrontendUAT
        displayName: 'Build Frontend (UAT)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '$(nodeVersion)'

          - task: Cache@2
            displayName: 'Cache npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | $(frontendDir)/package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(frontendDir)/node_modules

          - script: npm ci
            displayName: 'Install dependencies'
            workingDirectory: '$(frontendDir)'

          - script: npm run build:uat
            displayName: 'Build frontend (UAT mode)'
            workingDirectory: '$(frontendDir)'

          - task: ArchiveFiles@2
            displayName: 'Archive build'
            inputs:
              rootFolderOrFile: '$(frontendDir)/dist'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'

          - publish: $(Build.ArtifactStagingDirectory)/frontend.zip
            artifact: frontend-uat
            displayName: 'Upload frontend artifact'

      # Apply DB migrations (EF idempotent script + psql) before the API deploys
      - template: azure-pipelines.db-migrate.yml
        parameters:
          suffix: UAT
          environment: 'spacelinx-mes-uat'
          azureSubscription: 'SpaceLinxUAT'
          keyVaultName: 'spacelinx-uat-kv'

      - deployment: DeployApiUAT
        displayName: 'Deploy API'
        dependsOn: DeployDbUAT
        # Deploy the API when the DB job Succeeded OR was Skipped (Skipped = applyEfMigrations
        # is still 'false' for this env, the pre-stamping default). A genuine migration
        # *failure* yields 'Failed' — not in this set — and correctly blocks the API deploy.
        condition: in(dependencies.DeployDbUAT.result, 'Succeeded', 'Skipped')
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-uat'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: api

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxapiuat'
                  inputs:
                    azureSubscription: 'SpaceLinxUAT'
                    appType: 'webAppLinux'
                    appName: 'spacelinxapiuat'
                    resourceGroupName: 'SpaceLinxUat'
                    package: '$(Pipeline.Workspace)/api/*.zip'
                    runtimeStack: 'DOTNETCORE|10.0'

      - deployment: DeployWebUAT
        displayName: 'Deploy Frontend'
        dependsOn: BuildFrontendUAT
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-uat'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: frontend-uat

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxmesuat'
                  inputs:
                    azureSubscription: 'SpaceLinxUAT'
                    appType: 'webApp'
                    appName: 'spacelinxmesuat'
                    resourceGroupName: 'SpaceLinxUat'
                    package: '$(Pipeline.Workspace)/frontend-uat/frontend.zip'

  # ──────────────────────────────────────────────────────────
  # DEPLOY PROD (on v* tags, with approval gate)
  # ──────────────────────────────────────────────────────────
  - stage: DeployProd
    displayName: 'Deploy to Production'
    dependsOn: [BuildAPI, BuildFrontend, ValidateDb]
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      # Build frontend for Prod
      - job: BuildFrontendProd
        displayName: 'Build Frontend (Prod)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '$(nodeVersion)'

          - task: Cache@2
            displayName: 'Cache npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | $(frontendDir)/package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(frontendDir)/node_modules

          - script: npm ci
            displayName: 'Install dependencies'
            workingDirectory: '$(frontendDir)'

          - script: npm run build
            displayName: 'Build frontend (production mode)'
            workingDirectory: '$(frontendDir)'

          - task: ArchiveFiles@2
            displayName: 'Archive build'
            inputs:
              rootFolderOrFile: '$(frontendDir)/dist'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'

          - publish: $(Build.ArtifactStagingDirectory)/frontend.zip
            artifact: frontend-prod
            displayName: 'Upload frontend artifact'

      # Deploy API to Prod
      # Apply DB migrations (EF idempotent script + psql) before the API deploys — gated by the prod environment approval
      - template: azure-pipelines.db-migrate.yml
        parameters:
          suffix: Prod
          environment: 'spacelinx-mes-prod'
          azureSubscription: 'SpaceLinxProd'
          keyVaultName: 'spacelinx-prod-kv'

      - deployment: DeployApiProd
        displayName: 'Deploy API (Prod)'
        dependsOn: DeployDbProd
        # Deploy the API when the DB job Succeeded OR was Skipped (Skipped = applyEfMigrations
        # is still 'false' for this env, the pre-stamping default). A genuine migration
        # *failure* yields 'Failed' — not in this set — and correctly blocks the API deploy.
        condition: in(dependencies.DeployDbProd.result, 'Succeeded', 'Skipped')
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: api

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxapiprod'
                  inputs:
                    azureSubscription: 'SpaceLinxProd'
                    appType: 'webAppLinux'
                    appName: 'spacelinxapiprod'
                    resourceGroupName: 'SpaceLinxProd'
                    package: '$(Pipeline.Workspace)/api/*.zip'
                    runtimeStack: 'DOTNETCORE|10.0'

                - task: AzureAppServiceManage@0
                  displayName: 'Restart API (Prod)'
                  inputs:
                    azureSubscription: 'SpaceLinxProd'
                    action: 'Restart Azure App Service'
                    webAppName: 'spacelinxapiprod'
                    resourceGroupName: 'SpaceLinxProd'

      # Deploy Frontend to Prod
      - deployment: DeployWebProd
        displayName: 'Deploy Frontend (Prod)'
        dependsOn: BuildFrontendProd
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'spacelinx-mes-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: frontend-prod

                - task: AzureWebApp@1
                  displayName: 'Deploy to spacelinxmesprod'
                  inputs:
                    azureSubscription: 'SpaceLinxProd'
                    appType: 'webApp'
                    appName: 'spacelinxmesprod'
                    resourceGroupName: 'SpaceLinxProd'
                    package: '$(Pipeline.Workspace)/frontend-prod/frontend.zip'

                - task: AzureAppServiceManage@0
                  displayName: 'Restart Frontend (Prod)'
                  inputs:
                    azureSubscription: 'SpaceLinxProd'
                    action: 'Restart Azure App Service'
                    webAppName: 'spacelinxmesprod'
                    resourceGroupName: 'SpaceLinxProd'
