# Flyway configuration (non-secret). Connection + placeholders are injected per environment
# via FLYWAY_* environment variables in the pipeline (sourced from Key Vault).
#
# SQL location: /flyway/sql (mounted from database/migrations/versioned).
# Anything applied before Flyway adoption (the SSDT schema under database/SpaceLinx and the legacy
# database/migrations/migration_*.sql scripts) is the implicit baseline — Flyway manages forward
# changes only, starting at V001.

flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.baselineDescription=Pre-Flyway baseline (SSDT schema + legacy migrations)
flyway.outOfOrder=false
flyway.validateOnMigrate=true
flyway.placeholderReplacement=true

# Safety: never allow `flyway clean` to drop objects in any environment.
flyway.cleanDisabled=true
